# GPT-Pro on Cloud —— 独立产品。
# gateway 是唯一入口；desktop-a / desktop-b 是内置席位。额外账号在面板里添加，
# 由 gateway 经 docker.sock 克隆同一桌面镜像，不必再改这份 compose。

x-desktop-env: &desktop-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Asia/Shanghai}
  CUSTOM_USER: abc
  PASSWORD: ${VNC_PASSWORD:-gpc-internal}
  TITLE: GPT Pro
  START_URL: ${START_URL:-https://chatgpt.com}
  PROXY_URL: ${PROXY_URL:-}
  LIBGL_ALWAYS_SOFTWARE: "1"

x-desktop: &desktop
  build: ./docker
  image: ghcr.io/jingxuankang/gpt-pro-cloud-desktop:latest
  extra_hosts:
    - "host.docker.internal:host-gateway"
  shm_size: "1gb"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "2"

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ghcr.io/jingxuankang/gpt-pro-cloud-gateway:latest
    container_name: gpt-pro-cloud-gateway
    environment:
      - PORT=8080
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_USER=${AUTH_USER:-admin}
      - USERS_FILE=/data/users.json
      - INSTANCES=${INSTANCES:-a,b}
      - TAB_SEATS_MAX=${TAB_SEATS_MAX:-3}
      - VNC_USER=abc
      - VNC_PASSWORD=${VNC_PASSWORD:-gpc-internal}
      # 面板「添加账号」通过 Engine API 克隆 desktop-a；一次配置：挂上 docker.sock
      - DESKTOP_TEMPLATE=gpt-pro-cloud-a
      - DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      - ./data-panel:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-36090}:8080"
    depends_on:
      - desktop-a
      - desktop-b
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  desktop-a:
    <<: *desktop
    container_name: gpt-pro-cloud-a
    environment:
      <<: *desktop-env
      # 本账号专属出口代理，留空则用全局 PROXY_URL
      PROXY_URL_OVERRIDE: ${PROXY_URL_A:-}
    volumes:
      - ./data/a:/config
    # Chromium DevTools 默认关闭。面板「多人分屏」才会写 ENABLE_CDP /
    # /config/.gpc-cdp。调试口不映射宿主机，cdp-fwd 只接受 gateway。

  desktop-b:
    <<: *desktop
    container_name: gpt-pro-cloud-b
    environment:
      <<: *desktop-env
      PROXY_URL_OVERRIDE: ${PROXY_URL_B:-}
    volumes:
      - ./data/b:/config
